<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility Intelligence</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f4f7fb}.card{border:0;border-radius:18px;box-shadow:0 7px 22px rgba(0,0,0,.07)}.hero{background:linear-gradient(135deg,#198754,#0d6efd);color:#fff;padding:50px 20px}</style></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/"><i class="bi bi-truck"></i> Smart Logistics AI</a><a class="btn btn-outline-light btn-sm" href="/">Home</a></div></nav><section class="hero text-center"><div class="container"><h1>Accessibility Intelligence</h1><p class="mb-0">Evaluate accessibility factors for a selected location.</p></div></section><div class="container py-5"><div class="card p-4 p-md-5"><h3 class="mb-4">Accessibility Analysis</h3><form method="POST" action="/analyze-accessibility"><div class="row g-4"><div class="col-md-6"><label class="form-label fw-semibold">Location *</label><input class="form-control" name="location" placeholder="e.g. Salem" required></div><div class="col-md-6"><label class="form-label fw-semibold">Accessibility Requirement *</label><select class="form-select" name="user_type" required><option value="">Select requirement</option><option>Wheelchair Access</option><option>Visual Accessibility</option><option>General Accessibility</option></select></div><div class="col-md-6"><label class="form-label">Analysis Distance</label><select class="form-select" name="distance_range"><option>1 km</option><option>3 km</option><option>5 km</option><option>10 km</option></select></div><div class="col-12"><div class="alert alert-info">The prototype evaluates ramp access, pathways, facilities and signage using the project's accessibility intelligence model.</div></div><div class="col-12 text-center"><button class="btn btn-success btn-lg px-5"><i class="bi bi-universal-access"></i> Analyze Accessibility</button></div></div></form></div></div></body></html>
